version: '3.8'

services:
  web:
    build: .
    container_name: grifo_grau_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - grifo_network
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=grifo_grau
      - DB_USER=root
      - DB_PASS=rootpassword

  db:
    image: mysql:8.0
    container_name: grifo_grau_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: grifo_grau
      MYSQL_USER: grifo_user
      MYSQL_PASSWORD: grifo_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - grifo_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: grifo_grau_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - grifo_network

volumes:
  db_data:

networks:
  grifo_network:
    driver: bridge
